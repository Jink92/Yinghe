// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/releases" }
        maven { url "https://storage.googleapis.com/r8-releases/raw" }
        maven { url "https://chaquo.com/maven" }
        maven {
            url "http://4thline.org/m2"
            allowInsecureProtocol = true
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath "com.chaquo.python:gradle:16.1.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/releases" }
        gradlePluginPortal()
        maven {
            url "http://4thline.org/m2"
            allowInsecureProtocol = true
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// 打包后把 TV 版和手机版 APK 复制到 outputs/ 目录,每种版本只保留最近 2 个历史包
task copyApks {
    doLast {
        def outputsDir = file("$rootDir/outputs")
        outputsDir.mkdirs()
        def timestamp = new Date().format("yyyyMMdd_HHmmss")

        // TV 版: 优先 release, 否则 debug
        def tvRelease = file("$rootDir/app/build/outputs/apk/java/release/Yinghe_tv.apk")
        def tvDebug = file("$rootDir/app/build/outputs/apk/java/debug/Yinghe_tv.apk")
        def tvApk = tvRelease.exists() ? tvRelease : tvDebug
        if (tvApk.exists()) {
            def flavor = tvRelease.exists() ? "Release" : "Debug"
            def target = file("$outputsDir/Yinghe_TV_${flavor}_${timestamp}.apk")
            target.parentFile.mkdirs()
            target.bytes = tvApk.bytes
            file("$outputsDir/Yinghe_TV_latest.apk").bytes = tvApk.bytes
            println "✅ TV ${flavor} → ${target.name}"
        } else {
            println "⚠️  TV 版 APK 不存在"
        }

        // 手机版: 优先 release, 否则 debug
        def mobileRelease = file("$rootDir/app_mobile/build/outputs/apk/release/Yinghe_mobile.apk")
        def mobileDebug = file("$rootDir/app_mobile/build/outputs/apk/debug/Yinghe_mobile.apk")
        def mobileApk = mobileRelease.exists() ? mobileRelease : mobileDebug
        if (mobileApk.exists()) {
            def flavor = mobileRelease.exists() ? "Release" : "Debug"
            def target = file("$outputsDir/Yinghe_Mobile_${flavor}_${timestamp}.apk")
            target.parentFile.mkdirs()
            target.bytes = mobileApk.bytes
            file("$outputsDir/Yinghe_Mobile_latest.apk").bytes = mobileApk.bytes
            println "✅ 手机版 ${flavor} → ${target.name}"
        } else {
            println "⚠️  手机版 APK 不存在"
        }

        // 每种版本只保留最近 2 个历史包 (匹配带 Release_/Debug_ 或不带 flavor 前缀的)
        def cleanupAll = { String prefix ->
            def all = outputsDir.listFiles()?.findAll { f -> f.name ==~ /${prefix}_(Release|Debug)?_?\d{8}_\d{6}\.apk/ } ?: []
            all.sort { a, b -> b.name <=> a.name }
            all.drop(2).each { f ->
                f.delete()
                println "🗑️  删除旧包 ${f.name}"
            }
        }
        cleanupAll("Yinghe_TV")
        cleanupAll("Yinghe_Mobile")
    }
}
