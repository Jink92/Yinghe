// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/releases" }
        maven { url "https://storage.googleapis.com/r8-releases/raw" }
        maven { url "https://chaquo.com/maven" }
        maven {
            url "http://4thline.org/m2"
            allowInsecureProtocol = true
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath "com.chaquo.python:gradle:16.1.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/releases" }
        gradlePluginPortal()
        maven {
            url "http://4thline.org/m2"
            allowInsecureProtocol = true
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// 打包后把 TV 版和手机版 APK 复制到 outputs/ 目录,每种版本只保留最近 2 个历史包
task copyApks {
    doLast {
        def outputsDir = file("$rootDir/outputs")
        outputsDir.mkdirs()
        def timestamp = new Date().format("yyyyMMdd_HHmmss")

        // 清理函数:匹配 prefix_*.apk,按文件名排序保留最新 keep 个
        def cleanup = { String prefix, int keep ->
            def all = outputsDir.listFiles()?.findAll { f -> f.name ==~ /${prefix}_\d{8}_\d{6}\.apk/ } ?: []
            all.sort { a, b -> b.name <=> a.name }
            all.drop(keep).each { f ->
                f.delete()
                println "🗑️  删除旧包 ${f.name}"
            }
        }

        def tvApk = file("$rootDir/app/build/outputs/apk/java/debug/Yinghe_tv.apk")
        if (tvApk.exists()) {
            def target = file("$outputsDir/Yinghe_TV_${timestamp}.apk")
            target.parentFile.mkdirs()
            target.bytes = tvApk.bytes
            file("$outputsDir/Yinghe_TV_latest.apk").bytes = tvApk.bytes
            println "✅ TV 版 → ${target.name}"
        } else {
            println "⚠️  TV 版 APK 不存在，先跑 :app:assembleJavaDebug"
        }

        def mobileApk = file("$rootDir/app_mobile/build/outputs/apk/debug/Yinghe_mobile.apk")
        if (mobileApk.exists()) {
            def target = file("$outputsDir/Yinghe_Mobile_${timestamp}.apk")
            target.parentFile.mkdirs()
            target.bytes = mobileApk.bytes
            file("$outputsDir/Yinghe_Mobile_latest.apk").bytes = mobileApk.bytes
            println "✅ 手机版 → ${target.name}"
        } else {
            println "⚠️  手机版 APK 不存在，先跑 :app_mobile:assembleDebug"
        }

        // 每种版本只保留最近 2 个历史包
        cleanup("Yinghe_TV", 2)
        cleanup("Yinghe_Mobile", 2)
    }
}
